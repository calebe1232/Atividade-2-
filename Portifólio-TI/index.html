<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title src="script.js"></title>
    
    <link rel="stylesheet" href="css.css">
</head>
<body>
<section id="inicio" class="hero">
  <div class="container hero-inner">
    
    <!-- Texto à esquerda -->
    <div class="hero-content">
      <p class="hero-greeting" id="saudacao">Bom dia,</p>
      <h1 class="hero-title">Eu sou <span>Seu Nome</span></h1>
      <p class="hero-subtitle">Desenvolvedor Front-end em formação</p>
      <p class="hero-desc">
        Transformando ideias em interfaces limpas e acessíveis.
      </p>
      <div class="hero-actions">
        <a href="#projetos" class="btn btn-primary">Ver Projetos</a>
        <a href="#contato" class="btn btn-outline">Fale Comigo</a>
      </div>
    </div>

    <!-- Foto à direita -->
    <div class="hero-visual">
      <div class="avatar-wrapper">
        <img src="img/avatar.jpg" alt="" class="avatar" width="320" height="320">
      </div>
    </div>

  </div>
</section>
</body>
</html>
